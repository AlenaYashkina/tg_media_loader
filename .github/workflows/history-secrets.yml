name: Full-history secret audit
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  gitleaks-history:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan available Git history (redacted output)
        shell: bash
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --log-opts="--all" /repo
